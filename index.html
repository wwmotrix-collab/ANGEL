<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ANGEL — Agente Núcleo de Gestão Eleitoral</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="core/design.css">
  <link rel="stylesheet" href="core/angel-home.css">
  <link rel="stylesheet" href="core/brand.css">

  <style>
    html, body { height:100%; overflow:hidden; }
    #app { height:100%; display:none; flex-direction:column; }
    #app.show { display:flex; }
    #appView { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; position: relative; }
    #appView > div[style*="height:100%"], #appView > div[style*="height: 100%"] { height: 100%; }
  </style>
</head>
<body>

<div id="loginScreen">
  <div class="login-logo" id="loginLogoClick">
    <img class="login-logo-img" src="assets/brand/angel-logo.svg" alt="ANGEL — Agente Núcleo de Gestão Eleitoral">
  </div>
  <div class="login-sub">Agente Núcleo de Gestão Eleitoral</div>

  <div class="login-card">
    <div class="login-title">Entrar como</div>
    <div class="nivel-btns">
      <button class="nivel-btn active" id="nb-campo"><span class="nb-icon">🏃</span><span class="nb-label">Campo</span></button>
      <button class="nivel-btn" id="nb-coord"><span class="nb-icon">🎯</span><span class="nb-label">Coordenador</span></button>
      <button class="nivel-btn" id="nb-admin" style="display:none;"><span class="nb-icon">👑</span><span class="nb-label">Candidato</span></button>
      <button class="nivel-btn" id="nb-master" style="display:none;"><span class="nb-icon">⚙️</span><span class="nb-label">Master</span></button>
    </div>

    <div class="field"><label>Seu nome</label><input type="text" id="loginNome" placeholder="Nome completo" autocomplete="off" autocorrect="off"></div>
    <div class="field"><label>Senha</label><input type="password" id="loginSenha" placeholder="Senha de campanha"></div>

    <button class="btn btn-primary w-full" id="btnEntrar">Entrar</button>
    <div class="login-error" id="loginError" style="display:none;"></div>
  </div>
</div>

<div id="app">
  <div class="header">
    <div class="header-logo" id="headerLogo">
      <img class="header-logo-img" src="assets/brand/angel-logo.svg" alt="ANGEL — Agente Núcleo de Gestão Eleitoral">
    </div>

    <div class="header-badge" id="nivelBadge">Campo</div>

    <div class="header-actions">
      <div id="fbStatus"><span id="fbDot"></span><span id="fbTxt">sync</span></div>
      <button class="icon-btn" id="btnCentrar" title="Centralizar mapa">🎯</button>
      <button class="icon-btn" onclick="WWMX.Auth.sair()" title="Sair">🚪</button>
    </div>
  </div>

  <div class="nav-select-wrap"><select id="navSelect"></select><span style="font-size:12px;color:var(--muted);pointer-events:none;margin-left:-24px;">▾</span></div>
  <div id="appView"></div>
</div>

<div class="toast-container" id="toastContainer"></div>
<div id="lightbox" onclick="fecharLightbox()"><button id="lightbox-close" onclick="fecharLightbox()">✕</button><img id="lightboxImg" src="" alt=""></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="core/config.js"></script>
<script src="core/ui.js"></script>
<script src="core/firebase.js"></script>
<script src="core/auth.js"></script>
<script src="core/login-levels.js"></script>
<script src="core/xp.js"></script>
<script src="core/router.js"></script>

<script>
function abrirLightbox(src) { document.getElementById('lightboxImg').src = src; document.getElementById('lightbox').classList.add('show'); }
function fecharLightbox() { document.getElementById('lightbox').classList.remove('show'); }
document.getElementById('btnCentrar').addEventListener('click', function() { if (window.WWMX?.mapaInstance) { const map = window.WWMX.mapaInstance; if (navigator.geolocation) { navigator.geolocation.getCurrentPosition(pos => map.setView([pos.coords.latitude, pos.coords.longitude], 16), () => showToast('GPS não disponível', 'error')); } } });
function formatDate(ts) { if (!ts) return '—'; const d = new Date(ts); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }); }
function calcKm(pontos) { if (!pontos || pontos.length < 2) return 0; let total = 0; for (let i = 1; i < pontos.length; i++) { const R = 6371; const dLat = (pontos[i].lat - pontos[i-1].lat) * Math.PI / 180; const dLng = (pontos[i].lng - pontos[i-1].lng) * Math.PI / 180; const a = Math.sin(dLat/2)**2 + Math.cos(pontos[i-1].lat * Math.PI/180) * Math.cos(pontos[i].lat * Math.PI/180) * Math.sin(dLng/2)**2; total += R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); } return total; }
window.calcKm = calcKm; window.formatDate = formatDate;
function comprimirFoto(file, callback, maxW = 1200, qualidade = 0.65) { const reader = new FileReader(); reader.onload = ev => { const img = new Image(); img.onload = () => { const ratio = Math.min(1, maxW / img.width); const canvas = document.createElement('canvas'); canvas.width = Math.round(img.width * ratio); canvas.height = Math.round(img.height * ratio); canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height); callback(canvas.toDataURL('image/jpeg', qualidade)); }; img.src = ev.target.result; }; reader.readAsDataURL(file); }
window.comprimirFoto = comprimirFoto;
</script>
</body>
</html>
