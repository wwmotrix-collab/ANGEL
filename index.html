<!DOCTYPE html>

<!-- ══════════════════════════════════════════════
     SCRIPTS — ORDEM IMPORTA
     1. Leaflet (necessário antes dos módulos de mapa)
     2. Firebase SDKs compat v9
     3. Core WWMX (firebase → config → ui → auth → router)
     4. Módulos carregados dinamicamente pelo router
═══════════════════════════════════════════════ -->

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<!-- Core WWMX -->
<script src="core/config.js"></script>
<script src="core/ui.js"></script>
<script src="core/firebase.js"></script>
<script src="core/auth.js"></script>
<script src="core/xp.js"></script>
  <script src="core/router.js"></script>

<!-- Utilitários globais inline -->
<script>
// ── Lightbox ──
function abrirLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function fecharLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

// ── Centralizar mapa (botão 🎯 na header) ──
document.getElementById('btnCentrar').addEventListener('click', function() {
  if (window.WWMX?.mapaInstance) {
    const map = window.WWMX.mapaInstance;
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => map.setView([pos.coords.latitude, pos.coords.longitude], 16),
        ()  => showToast('GPS não disponível', 'error')
      );
    }
  }
});

// ── Compatibilidade com código legado ──
// Alguns módulos ainda chamam formatDate() diretamente
function formatDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

// calcKm (haversine) — usado por campo/percursos e coordenador/rotas
function calcKm(pontos) {
  if (!pontos || pontos.length < 2) return 0;
  let total = 0;
  for (let i = 1; i < pontos.length; i++) {
    const R = 6371;
    const dLat = (pontos[i].lat - pontos[i-1].lat) * Math.PI / 180;
    const dLng = (pontos[i].lng - pontos[i-1].lng) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2
            + Math.cos(pontos[i-1].lat * Math.PI/180)
            * Math.cos(pontos[i].lat   * Math.PI/180)
            * Math.sin(dLng/2)**2;
    total += R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  return total;
}
window.calcKm = calcKm;
window.formatDate = formatDate;

// comprimirFoto — usado por campo/mapa e modulos/denuncias
function comprimirFoto(file, callback, maxW = 1200, qualidade = 0.65) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const ratio = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width  = Math.round(img.width  * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', qualidade));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
window.comprimirFoto = comprimirFoto;
</script>
